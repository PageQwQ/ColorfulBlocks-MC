name: build

# See the equivalent workflow on the main (26.1.2) branch. Both branches ship in one GitHub
# release, so both need their own check.
#
# Java 21 here: this branch targets MC 1.21.1 and sets `options.release = 21`.

on:
  push:
    branches: ['1.21.1']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Accept the test server's EULA
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt

      - name: Run GameTests
        run: ./gradlew runGameTest

      - name: Check GameTest results
        if: always()
        run: |
          report=build/gametest-results.xml
          if [ ! -f "$report" ]; then
            echo "::error::no GameTest report written to $report"
            exit 1
          fi
          if grep -q "<failure" "$report"; then
            echo "::error::GameTest failures:"
            cat "$report"
            exit 1
          fi
          echo "GameTests passed:"
          cat "$report"

      - name: Upload GameTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-results
          path: build/gametest-results.xml
          if-no-files-found: ignore
