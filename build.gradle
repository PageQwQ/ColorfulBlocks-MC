buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Gradle Plugin Portal'
            url = 'https://plugins.gradle.org/m2/'
        }
        gradlePluginPortal()
    }
    dependencies {
        // Pinned release, not a SNAPSHOT: a moving buildscript dependency makes the same source
        // produce different build output on different days.
        classpath "net.fabricmc:fabric-loom:1.7.4"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'

// Version comes from gradle.properties ONLY. It is never written back by a build.
//
// This used to auto-increment `mod_version` on every build, at configuration time, so it also fired on
// `--dry-run` and on builds that later FAILED. The result was a version number consumed by "I thought
// about building" rather than by "I shipped", drifting away from the released tags.
//
// mod_version must stay IDENTICAL to the RGBBlocks-Fabric (26.1.2) branch, because one GitHub release
// carries both jars. Bump both in the same release commit.
version = "${minecraft_version}-${project.mod_version}-fabric-${(System.currentTimeMillis() / 1000).intValue()}"
group = project.maven_group
base.archivesName = project.archives_base_name

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        colorblockmc {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        gameTest {
            server()
            programArgs "--nogui"
            property "fabric-api.gametest", "true"
            property "fabric-api.gametest.report-file", "${project.buildDir}/gametest-results.xml"
        }
        autotest {
            client()
            programArgs "--quickPlaySingleplayer", "CTM Test"
            property "colorblockmc.autotest", "true"
        }
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:2.0.5+6fc22b9919"
    modCompileOnly "maven.modrinth:jade:15.10.6+fabric"
    modRuntimeOnly "maven.modrinth:jade:15.10.6+fabric"
    modCompileOnly "maven.modrinth:continuity:3.0.0+1.21"
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

jar {
    // The GameTest classes stay in the jar on purpose. fabric.mod.json declares the "fabric-gametest"
    // entrypoint pointing at them, so excluding them here would ship a jar whose own metadata names a
    // class that is not in it. The entrypoint is only resolved when fabric-gametest-api-v1 is present,
    // so ordinary players are unaffected. Cost: ~4 KB.
}